{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4" style="margin: 12px 16px;">
    <h1 class="h3 fw-semibold"><i class="bi bi-list-check"></i> Your Tasks</h1>
    <a class="btn btn-success" href="{% url 'task-create' %}"><i class="bi bi-plus-lg"></i> New Task</a>
</div>
<div class="row g-4" style="margin: 0 16px;">
    {% for task in object_list %}
    <div class="col-lg-4 col-md-6">
        <a href="{% url 'task-detail' task.pk %}" class="text-decoration-none text-reset">
            <div class="card h-100 shadow-sm hover-shadow transition-3">
                <div class="card-body">
                    <h5 class="card-title fw-bold">{{ task.title }}</h5>
                    <p class="card-text mb-2">Priority:
                        <span class="badge
                  {% if task.priority == 'High' %}bg-danger
                  {% elif task.priority == 'Medium' %}bg-warning text-dark
                  {% else %}bg-secondary{% endif %}"> {{ task.priority }}</span>
                    </p>
                    <a href="{% url 'task-delete' task.pk %}" class="btn btn-outline-danger btn-sm"><i
                            class="bi bi-trash"></i>
                        Delete</a>
                </div>
                <div class="card-footer bg-transparent border-top-0 text-muted small">
                    Created: {{ task.created_at|date:"M d, Y" }}
                </div>
            </div>
        </a>

    </div>
    {% empty %}
    <div class="text-center py-5">
        <i class="bi bi-inbox fs-1 text-muted"></i>
        <p class="mt-3 text-muted">No tasks yet. Create your first one!</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
